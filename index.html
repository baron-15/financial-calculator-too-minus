<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A faithful online recreation of the BA II Plus financial calculator: TVM, cash flows, NPV/IRR, amortization, bonds, depreciation, statistics, and more." />
    <meta name="color-scheme" content="light dark" />
    <title>BA II Plus Online</title>
    <script>
      // Apply a saved page theme before first paint. With none saved, no data-theme is set and the page
      // follows the OS through prefers-color-scheme (see src/hooks/useTheme.ts and src/index.css).
      (function () {
        try {
          var t = localStorage.getItem("ba2plus:theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
